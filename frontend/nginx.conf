server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: react-admin client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the content-hashed assets: heuristic caching of it pins
    # clients to chunk hashes a fresh deploy has already deleted (404s). It
    # must revalidate every load — exactly like the service worker above.
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Vite emits content-hashed assets under /assets — safe to cache immutably.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # service worker / manifest live at the root (PWA).
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; }
}
