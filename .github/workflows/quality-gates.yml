name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Backend unit tests
        run: .venv/bin/pytest -m "not integration"

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vfic
          POSTGRES_PASSWORD: vfic
          POSTGRES_DB: vfic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfic -d vfic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vfic:vfic@127.0.0.1:5432/vfic
      DATABASE_URL_SYNC: postgresql+psycopg://vfic:vfic@127.0.0.1:5432/vfic
      REDIS_URL: redis://127.0.0.1:6382/0
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Backend integration smoke
        run: .venv/bin/pytest -m integration tests/integration/test_harness_smoke.py

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: App unit tests
        env:
          CI: "1"
        run: npm run test:unit:app -- --run

      - name: Changed-surface coverage
        env:
          CI: "1"
        run: npm run test:unit:app:coverage:changed-surface -- --run

      - name: Build
        run: npm run build

  functional-e2e:
    name: Functional E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - Mobile Chrome
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vfic
          POSTGRES_PASSWORD: vfic
          POSTGRES_DB: vfic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfic -d vfic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create backend venv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Run functional Playwright
        working-directory: frontend
        env:
          CI: "1"
        run: |
          if [ "${{ matrix.project }}" = "chromium" ]; then
            npm run test:e2e:desktop
          else
            npm run test:e2e:mobile
          fi

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_GATE_LATENCY_SLO_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Generate offline golden results
        run: |
          echo "GOLDEN_RESULTS_RAW=$RUNNER_TEMP/release-golden-results-raw.json" >> "$GITHUB_ENV"
          echo "GOLDEN_RESULTS=$RUNNER_TEMP/release-golden-results.json" >> "$GITHUB_ENV"
          .venv/bin/python scripts/benchmark_rag.py --gold --min-pass-rate 0 --output "$RUNNER_TEMP/release-golden-results-raw.json"
          .venv/bin/python - "$RUNNER_TEMP/release-golden-results-raw.json" "$RUNNER_TEMP/release-golden-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          passed = raw.get("passed")
          case_count = raw.get("case_count")
          if isinstance(passed, bool) or not isinstance(passed, int):
              raise SystemExit("benchmark artifact missing integer passed")
          if isinstance(case_count, bool) or not isinstance(case_count, int) or case_count <= 0:
              raise SystemExit("benchmark artifact missing positive integer case_count")
          if passed < 0 or passed > case_count:
              raise SystemExit("benchmark artifact has invalid passed/case_count values")
          Path(sys.argv[2]).write_text(
              json.dumps({"golden_pass_rate_pct": passed / case_count * 100.0}),
              encoding="utf-8",
          )
          PY

      - name: Evaluate release gate
        run: .venv/bin/python scripts/release_gate_check.py --golden-results "$GOLDEN_RESULTS"
