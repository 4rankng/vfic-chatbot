name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Docs drift check (deployment guide names the current alembic head)
        run: |
          HEAD_REV="$(.venv/bin/python -m alembic heads | awk 'NR==1{print $1}')"
          grep -qF "**HEAD:** \`$HEAD_REV" ../docs/deployment-guide.md \
            || { echo "docs/deployment-guide.md's Alembic HEAD does not match alembic heads ($HEAD_REV) — update section 4 (Alembic migration run)."; exit 1; }

      - name: Backend unit tests (coverage gate)
        run: .venv/bin/pytest -m "not integration" --cov --cov-config=.coveragerc --cov-report=term-missing

  backend-integration:
    name: Backend Integration
    runs-on: ubuntu-latest
    # The full -m integration lane (29 files) chains several alembic subprocess
    # runs per migration test; the slowest single test takes ~5s locally but CI
    # runners are slower, so allow generous headroom over the ~1m local run.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vfic
          POSTGRES_PASSWORD: vfic
          POSTGRES_DB: vfic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfic -d vfic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vfic:vfic@127.0.0.1:5432/vfic
      DATABASE_URL_SYNC: postgresql+psycopg://vfic:vfic@127.0.0.1:5432/vfic
      REDIS_URL: redis://127.0.0.1:6382/0
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Backend integration smoke (fast fail)
        run: .venv/bin/pytest -m integration tests/integration/test_harness_smoke.py

      - name: Backend integration suite
        run: .venv/bin/pytest -m integration --durations=25

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Registry paths
        run: npm run registry:check

      - name: App unit tests
        env:
          CI: "1"
        run: npm run test:unit:app -- --run

      - name: App coverage gate
        env:
          CI: "1"
        run: npm run test:unit:app:coverage:changed-surface -- --run

      - name: Build
        run: npm run build

  functional-e2e:
    name: Functional E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - Mobile Chrome
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vfic
          POSTGRES_PASSWORD: vfic
          POSTGRES_DB: vfic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfic -d vfic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create backend venv
        working-directory: backend
        run: python -m venv .venv

      - name: Install backend dependencies
        working-directory: backend
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Run functional Playwright
        working-directory: frontend
        env:
          CI: "1"
        run: |
          if [ "${{ matrix.project }}" = "chromium" ]; then
            npm run test:e2e:desktop
          else
            npm run test:e2e:mobile
          fi

  visual-e2e:
    name: Visual E2E
    runs-on: ubuntu-latest
    # The rendering environment must stay byte-identical to the committed
    # -linux baselines: this job runs in the same pinned Playwright container
    # image the baselines were generated and verified in. The visual specs
    # render zero-backend pages (tagged @visual-only), so no PostgreSQL/Redis
    # services are needed and the backend webServer is skipped.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run visual Playwright
        env:
          VFIC_VISUAL_ONLY: "1"
        run: npm run test:e2e:visual

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_GATE_LATENCY_SLO_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: Generate offline golden results
        run: |
          echo "GOLDEN_RESULTS_RAW=$RUNNER_TEMP/release-golden-results-raw.json" >> "$GITHUB_ENV"
          echo "GOLDEN_RESULTS=$RUNNER_TEMP/release-golden-results.json" >> "$GITHUB_ENV"
          .venv/bin/python scripts/benchmark_rag.py --gold --min-pass-rate 0 --output "$RUNNER_TEMP/release-golden-results-raw.json"
          .venv/bin/python - "$RUNNER_TEMP/release-golden-results-raw.json" "$RUNNER_TEMP/release-golden-results.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          passed = raw.get("passed")
          case_count = raw.get("case_count")
          if isinstance(passed, bool) or not isinstance(passed, int):
              raise SystemExit("benchmark artifact missing integer passed")
          if isinstance(case_count, bool) or not isinstance(case_count, int) or case_count <= 0:
              raise SystemExit("benchmark artifact missing positive integer case_count")
          if passed < 0 or passed > case_count:
              raise SystemExit("benchmark artifact has invalid passed/case_count values")
          Path(sys.argv[2]).write_text(
              json.dumps({"golden_pass_rate_pct": passed / case_count * 100.0}),
              encoding="utf-8",
          )
          PY

      - name: Evaluate release gate
        run: .venv/bin/python scripts/release_gate_check.py --golden-results "$GOLDEN_RESULTS"

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory by design: findings surface as red step logs without blocking
    # merges, because a blocking gate on advisory databases halts releases over
    # upstream CVEs with no fix available. To promote a finding to blocking,
    # remove continue-on-error from that step; a risk that is deliberately
    # accepted is recorded as an --ignore-vuln comment in the pip-audit step
    # (or a documented override), never as silence.
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv
        run: python -m venv .venv

      - name: Install backend dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev] pip-audit

      - name: pip-audit (advisory)
        run: |
          # Deliberately accepted advisories are listed with a reason and the
          # date of the decision, e.g.:
          #   --ignore-vuln PYSEC-0000-0000  # accepted 2026-09-24: no fixed release yet
          .venv/bin/pip-audit --strict
        continue-on-error: true

      - name: npm audit, production dependencies (advisory)
        working-directory: frontend
        run: npm audit --omit=dev
        continue-on-error: true
