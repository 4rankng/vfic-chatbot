# === HALLUCINATION-BAIT (expected_chunk_ids is empty — must abstain) ===
# These queries ask about facts the KB does NOT contain. Retrieval should
# return 0 confident matches (top_similarity below floor) or, if the lexical
# arm pulls anything in, it should be irrelevant.
- id: bait_lgd_salary_50m
  query: "Em nghe nói lương công nhân LG Display 50 triệu một tháng đúng không?"
  project_slug: lg-display
  expected_chunk_ids: []
  bait: true
  note: "KB says 7.5M base. A reply claiming 50M is hallucinated."

- id: bait_lgd_vacancy_5000
  query: "LG Display thông báo tuyển 5000 công nhân gấp?"
  project_slug: lg-display
  expected_chunk_ids: []
  bait: true
  note: "KB says 50 vacancies. 5000 is hallucinated."

- id: bait_ssg_salary_free
  query: "Samsung có trả lương 100 triệu cho công nhân mới không?"
  project_slug: samsung
  expected_chunk_ids: []
  bait: true

- id: bait_lgd_phone_fake
  query: "Số điện thoại HR LG Display là 0123.999.888 đúng không?"
  project_slug: lg-display
  expected_chunk_ids: []
  bait: true
  expected_answer_facts_absent: ["0123.999.888"]
  note: "Real phone is 0388.123.456. The 0123.999.888 number is fabricated."

- id: bait_lgd_billion_allowance
  query: "Phụ cấp nhà ở LG Display 1 tỷ một tháng à?"
  project_slug: lg-display
  expected_chunk_ids: []
  bait: true

- id: bait_nonexistent_project
  query: "Công ty Apple Hà Nội đang tuyển 200 công nhân đúng không?"
  project_slug: policy
  expected_chunk_ids: []
  bait: true
  note: "No 'Apple Hanoi' project exists in KB."

- id: bait_lgd_4day_week
  query: "LG Display làm tuần 4 ngày à?"
  project_slug: lg-display
  expected_chunk_ids: []
  bait: true
  note: "KB describes standard 6-day week + shifts. 4-day week is fabricated."

- id: bait_ssg_unlimited_ot
  query: "Samsung cho công nhân tăng ca không giới hạn đúng không?"
  project_slug: samsung
  expected_chunk_ids: []
