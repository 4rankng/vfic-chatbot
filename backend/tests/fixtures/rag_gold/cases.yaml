# Vietnamese RAG precision gold-set cases.
#
# Each case maps a recruiter-style Vietnamese query to expected chunk IDs.
# Hallucination-bait cases have empty `expected_chunk_ids` — they ask about
# facts the KB does NOT contain (e.g. inflated salaries, unmentioned projects),
# and the gate asserts the retrieval returns 0 confident matches.
#
# `expected_answer_facts` is OPTIONAL — numeric facts that must appear in
# any acceptable chunk. Used to anchor numeric grounding tests (Phase 3).
#
# Cases span:
#   - salary/benefits/allowance queries (numeric — Phase 3 anchor)
#   - job/role/requirement queries (ranking — Phase 2 anchor)
#   - shift/schedule/location queries (structured vs RAG)
#   - out-of-scope / hallucination-bait queries (abstain behavior)
#
# The case ID is referenced in the precision report and CI gate output.

# === SALARY / BENEFIT QUERIES (lg-display) ===
- id: lgd_salary_basic
  query: "Lương cơ bản công nhân LG Display Hải Phòng bao nhiêu?"
  project_slug: lg-display
  expected_chunk_ids: [lgd_salary_chunk_01]
  expected_answer_facts: ["7.500.000"]

- id: lgd_salary_official
  query: "Sau thử việc lương chính thức tại LG Display là gì?"
  project_slug: lg-display
