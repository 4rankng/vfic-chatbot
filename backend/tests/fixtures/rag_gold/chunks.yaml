# Synthetic Vietnamese KB chunks for the RAG precision gold set.
#
# These fixtures are deliberately decoupled from production data — they exist
# only to exercise the retrieval pipeline (fusion, MMR dedup, sha256 dedup,
# reranker) against realistic Vietnamese recruiting content. The gold set
# protects retrieval *code* from regressions, not the production KB itself.
#
# Each chunk becomes a SimpleNamespace row with `similarity` computed at load
# time from canned embeddings (`embeddings.json`). Chunk fields mirror the
# real RetrievalRepository row shape (id, content, source_quote, summary,
# metadata, document_id, section_path, source_file, chunk_sha256, similarity).
#
# The `project_slug` groups chunks per fictional project. Chunk IDs must be
# globally unique; the loader hashes content into `chunk_sha256` if missing.

