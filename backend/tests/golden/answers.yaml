# Golden answer set — answer-quality eval (RAG pack B, P3-2).
#
# Parallel companion to ``dataset.yaml`` (that file gates intent/route/latency;
# this one gates the ANSWER: what the reply must contain). Each entry pins the
# expected answer points (điểm cần có) for one representative Vietnamese
# question, so ``scripts/eval_answers.py`` can grade generated answers by
# DeepEval (Faithfulness / AnswerRelevancy / ContextualPrecision /
# ContextualRecall) plus the deterministic fact-hit check below.
#
# Provenance: questions + facts are drawn from the retrieval gold set
# ``tests/fixtures/rag_gold/cases.json`` (real job-posting figures: LG Display
# Hải Phòng, Samsung Bắc Ninh, Bộ luật Lao động policy), so every entry is
# backed by a real KB chunk and a canned query embedding (`ref` links the two).
#
# Schema per entry:
#   id                       unique answer-gold id
#   category                 question family (salary, overtime, policy, ...)
#   ref                      rag_gold case id — supplies question text match,
#                            retrieval context, and expected chunk ids
#   question                 the Vietnamese question (MUST equal the ref'd
#                            case's query; enforced by test_answer_gold.py)
#   expected_answer_points   substrings a correct reply must contain
#                            (deterministic fact-hit check; NONE needed for
#                            `abstain` entries)
#   abstain                  true when the KB has NO answer — the reply must
#                            refuse rather than invent one (graded by the
#                            judge's faithfulness + the fact-hit exclusion)
#
# Fact-hit matching is deliberately coarse: diacritic-folded, case-folded,
# whitespace-collapsed substring search. It is a floor metric for the release
# gate; the LLM-judge metrics are the real graders. Pick points that survive a
# reasonable Vietnamese paraphrase ("7.500.000", "200%", "0388.123.456").
version: 1
entries:
