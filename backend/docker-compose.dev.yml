# Lightweight LOCAL DEV stack: Postgres+pgvector, Redis, Adminer only.
# Backend (uvicorn --reload) and frontend (vite) run on the host for hot-reload,
# so these services are exposed on localhost. `make dev` (from backend/) drives it.
#
# Loopback-only binding is the exposure control here (OPS-20): the dev DB is
# typically a copy of production data, and these credentials are the well-known
# `vfic/vfic`. If a dev Redis password is ever added, remember
# `backend/tests/e2e_harness.py` defaults to `redis://127.0.0.1:6382/15` with no
# password and would have to change in the same commit.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vfic
      POSTGRES_PASSWORD: vfic
      POSTGRES_DB: vfic
    ports: ["127.0.0.1:5432:5432"]
    volumes: [vfic_dev_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfic -d vfic"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Host port 6382 (not 6379) to avoid clashing with the payroll project's
    # redis on the same dev machine. backend/.env's REDIS_URL must match.
    ports: ["127.0.0.1:6382:6379"]
    volumes: [vfic_dev_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:4
    depends_on: [postgres]
    # Host 8082 (not 8081) to avoid clashing with the tuyennhanvien
    # workspace's adminer running on the same dev machine.
    ports: ["127.0.0.1:8082:8080"]

volumes:
  vfic_dev_pgdata:
  vfic_dev_redisdata:
