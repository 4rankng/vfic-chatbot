# VFIC production stack — image-based. Shipped to /opt/vfic on the droplet.
# Images: ghcr.io/4rankng/tinghire-be (web + workers + scheduler),
#         ghcr.io/4rankng/tinghire-fe (nginx static). Caddy = edge (auto-TLS).
# All app config comes from .env (compose auto-loads /opt/vfic/.env).
#
# Host (OPS-09, measured 2026-09-24): DigitalOcean droplet, 1 vCPU / 2 GB RAM
# (1967 MB usable) + 4 GB swap, 48 GB disk. These deploy-time figures are the
# authoritative ones; any doc claiming "4 GB" is stale. Memory limits are sized
# from measured resident usage — see the sum documented in
# docs/deployment-guide.md §1.
#
# Memory-limit ledger (OPS-09): every service carries a
# deploy.resources.limits.memory ceiling — postgres 448M, redis 320M, web-blue
# 384M, web-green 384M, worker-chatbot 3×512M, worker-persistence 512M,
# worker-ingest 512M, worker-followup 512M, worker-maintenance 384M, scheduler
# 128M, frontend 64M, adminer 128M, caddy 64M, oa-profile-backfill 512M
# (profile-gated). Sum of ceilings ≈ 5.3 GB against 1967 MB usable + swap: the
# limits are per-container KILL FENCES, not reservations. Steady-state RSS is
# far below each ceiling; the point of a fence is that a runaway container hits
# ITS cap and gets OOM-killed by Docker alone, instead of growing until the
# kernel OOM killer picks a victim (historically postgres or caddy — the
# unbounded-blast-radius outage). Revisit the ledger if the host size changes.
#
# App images are `${IMAGE_TAG:?…}`: a required variable, so no compose command
# can silently resolve `:latest` (OPS-10) — including bare `docker compose run`
# on the droplet, which now fails loudly until IMAGE_TAG is exported (read it
# from the running container: `docker inspect -f '{{.Config.Image}}' $(docker
# compose ps -q web-$(cat ACTIVE_COLOR))`). Base images are digest-pinned for
# the same reason; there is no automated digest-refresh PR yet, so a base-image
# bump is a deliberate edit of the pins below.

# --- Log rotation (OPS-04) ---------------------------------------------------
# Structured JSON logs to stdout are the only observability path by design, so
# every container must be bounded: the default json-file driver grows without
# limit and, when the volume fills, Postgres cannot write WAL and the whole stack
# goes down. One anchor, attached to every service — 10 MB × 3 files = a 30 MB
# ceiling per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Digest-pinned (OPS-10): the tag stays for readability, the digest is what
    # resolves, so an unattended pull cannot change the runtime under a frozen
    # application version.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    command: ["postgres", "-c", "max_connections=150"]
    # Docker's 64 MB /dev/shm default makes parallel sorts/hash joins fail with
    # "could not resize shared memory segment" — reachable at max_connections=150.
    shm_size: 256mb
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 448M  # measured 181 MB resident; shared_buffers alone is 128 MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vfic}
    volumes: [vfic_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    logging: *default-logging
    deploy:
      resources:
        limits:
          # --maxmemory 256mb bounds the dataset; the extra headroom covers the
          # AOF rewrite fork's copy-on-write pages (measured 6 MB resident).
          memory: 320M
    # volatile-lru: only TTL'd keys (embedding/RAG caches) are evictable. The
    # LLM semaphore token lists and cachever:* counters carry no TTL, so memory
    # pressure can never evict them and suppress every turn or resurrect stale
    # cache generations.
    # SEC-11: `--requirepass "$REDIS_PASSWORD"` interpolated the secret into the
    # container's argv, where `docker inspect` and `ps` both expose it. There is no
    # env channel for redis-server's own password, so the shell expands it from
    # REDIS_PASSWORD at start instead — argv then holds the literal `$REDIS_PASSWORD`
    # and the secret only ever lives in the environment. `exec` keeps redis-server
    # as PID 1, so signals and restart semantics are unchanged.
    # (Verified against redis:7-alpine: the wrapper boots, requires the password,
    # and `REDISCLI_AUTH=<same> redis-cli ping` answers PONG.)
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # SEC-11: the healthcheck password also reached argv via `redis-cli -a`,
      # so it was readable in `docker inspect` and in `ps` inside the container.
      # REDISCLI_AUTH is the documented env channel for exactly this — the probe
      # authenticates without the credential ever entering the command line.
      # (Verified: REDISCLI_AUTH=... redis-cli ping -> PONG on redis:7-alpine;
      # without it the server answers NOAUTH, so the probe still fails closed.)
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Blue/green web tier (zero-downtime deploy) -----------------------------
  # Two identical web replicas. Only the ACTIVE color (tracked in
  # /opt/vfic/ACTIVE_COLOR) receives traffic via the Caddyfile, which
  # reverse-proxies the active ``web-<color>:8000`` upstream. bg_deploy.sh brings
  # up the inactive color at the new IMAGE_TAG, runs scripts/smoke_turn.py
  # against it, then flip_caddy.sh renders + reloads Caddy onto it (graceful,
  # <1s, no dropped connections) and stops the old color. ``restart: unless-
  # stopped`` auto-restarts the active color on host reboot; the inactive color
  # is left ``stop``ped (not removed) so ``make rollback`` can revive it instantly.
  web-blue:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      # DB connection budget (see config.py): the steady state is ONE active web
      # colour + 3 chatbot + persistence/ingest/followup/maintenance workers = 8
      # DB-touching processes, i.e. 12 + 6×6 = 48 of the max_connections=150
      # ceiling. A cutover briefly adds the second colour's 12 (60 worst case).
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M  # measured 118 MB resident (single uvicorn worker)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    expose: ["8000"]
    healthcheck:
      # uvicorn serves /health on :8000. Python is guaranteed in the image (no curl dep).
      # The probe's own socket timeout (10s) must stay under the compose timeout
      # (15s) below. Both were 3s/5s until 2026-09-26, when deploy-time CPU
      # contention on this 2-vCPU host made the probe exceed 5s and both colours
      # reported `unhealthy` while serving fine — which aborts a deploy mid-flip.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=10).status==200 else 1)\""]
      interval: 10s
      timeout: 15s
      retries: 5
      # 30s absorbs the cold-boot fork window so compose's own probe does not
      # start firing before the single uvicorn worker has bound :8000.
      start_period: 30s
    restart: unless-stopped

  web-green:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
    deploy:
      resources:
        limits:
          # Mirrors web-blue (same image, same single uvicorn worker). Both
          # colours only run at the same time during a cutover window.
          memory: 384M
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=10).status==200 else 1)\""]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # RQ worker: interactive/recovery turns only. It stays isolated from
  # post-send enrichment so a slow persistence job cannot delay a webhook.
  worker-chatbot:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      # Workers run one job at a time (SimpleWorker) — 4+2 is ample and keeps
      # the deployment-wide worst case well under max_connections=150.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.run_worker", "webhook_high", "recovery"]
    stop_grace_period: 180s  # let rq finish the ≤60s turn on SIGTERM before SIGKILL
    deploy:
      replicas: 3  # RQ consumes webhook_high first and recovery second, so a
                   # recovered-turn backlog can never delay a live candidate turn.
                   # 3 replicas raise cross-conversation throughput (per-chat locks
                   # serialize same-chat turns); the 2026-09-22 recovery storm of
                   # 62 turns held candidates for 30–115s on 2.
      resources:
        limits:
          # 3 instances × measured RSS ~130M ≈ 390M on the 2GB droplet. 512M cap
          # per container lets Docker OOM-kill a runaway worker without taking
          # the host down; host headroom verified at deploy time.
          memory: 512M
    healthcheck:
      # Loop liveness, not socket liveness: RQ's work loop refreshes this
      # container's worker registration (key TTL = worker_ttl+60) on every
      # dequeue iteration, so a live loop keeps itself in Worker.all() and a
      # wedged one (socket fine, loop hung) expires out of the registry within
      # ~8 min — the Redis ping this replaces stayed healthy forever.
      test: ["CMD-SHELL", "python -c \"import os,socket,sys;from rq import Worker;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # The chatbot worker preloads langchain/openai + warms LLM clients before
      # the work loop registers itself; the probe must not fire before that.
      # Measured 83.2s on 2026-09-26 (2-vCPU host under deploy-time contention),
      # so 60s was already optimistic — 180s states the real budget.
      start_period: 180s
    restart: unless-stopped

  # RQ worker: best-effort lead/memory enrichment after a reply is sent.
  # It deliberately does not warm the chatbot graph or consume webhook_high.
  worker-persistence:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.run_worker", "persistence_low"]
    stop_grace_period: 180s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    healthcheck:
      # Loop liveness via the RQ worker registry — see worker-chatbot.
      test: ["CMD-SHELL", "python -c \"import os,socket,sys;from rq import Worker;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # RQ worker: knowledge ingest / reindex / bus rebuild (slow, Drive-bound).
  worker-ingest:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    # SEC-11: no `--url` — rq 2.10 falls back to os.environ["REDIS_URL"] when the
    # flag is absent (rq/cli/helpers.py:388 -> get_redis_from_config), so env_file
    # already supplies the broker and the credential stops appearing in argv.
    command: ["rq", "worker", "ingest"]
    healthcheck:
      # Loop liveness via the RQ worker registry — see worker-chatbot.
      test: ["CMD-SHELL", "python -c \"import os,socket,sys;from rq import Worker;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # Embedding/digestion bursts are the largest single-job heap in the
          # stack; same fence class as the other turn-executing workers.
          memory: 512M
    restart: unless-stopped

  # rq-scheduler: hourly Drive reconcile, 5-min outbound retry, 30-min proactive follow-up tick.
  scheduler:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      # SEC-11: rqscheduler does NOT read REDIS_URL — its --url flag defaults from
      # RQ_REDIS_URL (rq_scheduler/scripts/rqscheduler.py:22), and with no URL it
      # falls back to host/port/db/password (line 47), i.e. localhost. So dropping
      # `--url` alone would silently disconnect the scheduler from the broker.
      # Exporting the same value under the name rqscheduler actually reads keeps
      # the credential out of argv without changing where it connects.
      RQ_REDIS_URL: ${REDIS_URL}
    depends_on:
      redis: { condition: service_healthy }
    command: ["rqscheduler"]
    healthcheck:
      # Loop liveness: the scheduler's run loop re-expires its
      # rq:scheduler_instance:* birth key (TTL = poll interval + 10s, default
      # interval 60s) on every iteration. A live loop keeps the key present; a
      # dead or wedged one lets it expire within ~70s — so probe for the key,
      # not the Redis socket. scan_iter, never KEYS (blocking).
      test: ["CMD-SHELL", "python -c \"import os,sys;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if next(c.scan_iter(match='rq:scheduler_instance:*'),None) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          # The scheduler only reads Redis sorted sets and enqueues jobs — a
          # small fixed heap with no app imports worth fencing generously.
          memory: 128M
    restart: unless-stopped

  # RQ worker: proactive follow-up nudges (dedicated queue, isolated from reactive path).
  # Single replica — proactive volume is low (~5 candidates/tick, 30-min interval).
  # The reconcile sweep and outbound-dispatch ticks moved to worker-maintenance
  # so a backlog-driven reconcile cannot head-of-line-block the nudges.
  worker-followup:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # SEC-11: no `--url` — rq 2.10 falls back to os.environ["REDIS_URL"] when the
    # flag is absent (rq/cli/helpers.py:388 -> get_redis_from_config), so env_file
    # already supplies the broker and the credential stops appearing in argv.
    command: ["rq", "worker", "followup"]
    healthcheck:
      # Loop liveness via the RQ worker registry — see worker-chatbot.
      test: ["CMD-SHELL", "python -c \"import os,socket,sys;from rq import Worker;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          # Executes full proactive-nudge turns (graph + LLM clients in
          # memory) — same fence class as the other turn-executing workers.
          memory: 512M
    restart: unless-stopped

  # RQ worker: reconcile sweep + outbound dispatch ticks (maintenance queue,
  # split from followup). Single replica — the reconcile tick holds a Redis
  # non-reentrancy lock (reconcile_tick_lock, 300s), so overlapping schedules
  # skip; one worker keeps the two 60s ticks from competing with nudges.
  worker-maintenance:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # SEC-11: no `--url` — see worker-ingest; rq reads REDIS_URL from the env.
    command: ["rq", "worker", "maintenance"]
    deploy:
      resources:
        limits:
          # Reconcile sweeps are DB-row + Redis-key work without LLM clients;
          # below the turn-executing worker class.
          memory: 384M
    stop_grace_period: 180s  # let a mid-sweep reconcile finish on SIGTERM
    healthcheck:
      # Loop liveness via the RQ worker registry — see worker-chatbot.
      test: ["CMD-SHELL", "python -c \"import os,socket,sys;from rq import Worker;import redis as r;c=r.from_url(os.environ['REDIS_URL'],socket_connect_timeout=3,socket_timeout=3);sys.exit(0 if any(w.hostname==socket.gethostname() for w in Worker.all(connection=c)) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # In-stack ops-endpoint watcher: polls /health, /metrics and /health/queue
  # on the web colours from inside the compose network and turns regressions
  # into single-line JSON alerts on stdout — docker logs is the (rotation-
  # bounded) observability path. This is the in-stack half of the alerting
  # story; the host half is scripts/ops-alerts.sh (disk %, reclaimable Docker
  # space, cron). Alerts reaching a human (email/Telegram relay) is
  # deliberately not wired here: it needs an outbound token and belongs to the
  # droplet runbook. Thresholds are env-tunable via .env: interval seconds,
  # queue-depth ceiling (default 20 = half of CHAT_QUEUE_MAX_DEPTH), and how
  # many consecutive all-busy polls count as saturation (default 10 ≈ 5 min).
  metrics-watch:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          # stdlib-only poll loop (urllib + json); no app imports.
          memory: 128M
    command:
      - python
      - -c
      - |
        import json, os, time, urllib.request

        POLL = int(os.environ.get("METRICS_WATCH_INTERVAL", "30"))
        DEPTH_LIMIT = int(os.environ.get("METRICS_WATCH_MAX_QUEUE_DEPTH", "20"))
        SATURATION_POLLS = int(os.environ.get("METRICS_WATCH_SATURATION_POLLS", "10"))
        # Must be one of allowed_hosts (SEC-06) — see get().
        HOST_HEADER = os.environ.get("METRICS_WATCH_HOST_HEADER", "bot.tingting.vip")
        COLORS = ("web-blue", "web-green")
        QUEUE_KEYS = ("webhook_high", "recovery", "persistence_low", "ingest", "followup", "maintenance")
        COUNTERS = ("reconcile_enqueue_failed_total", "reconcile_unknown_send_outcome")

        def get(url):
            # TrustedHostMiddleware (SEC-06, allowed_hosts in .env) answers 400 to
            # a direct `Host: web-green:8000` probe, so every request must present
            # an allowed Host. Without this the poller saw both colours as dead
            # (found on its first ever run, 2026-09-26 — it had never been started).
            request = urllib.request.Request(url, headers={"Host": HOST_HEADER})
            with urllib.request.urlopen(request, timeout=5) as r:
                return json.loads(r.read().decode())

        def emit(level, alert, **fields):
            print(json.dumps({"ts": round(time.time()), "level": level, "alert": alert, **fields}), flush=True)

        prev_counters = {}
        saturation = {}
        while True:
            alive = []
            for color in COLORS:
                try:
                    if get("http://%s:8000/health" % color).get("status") == "ok":
                        alive.append(color)
                except Exception:
                    pass  # a stopped colour (normal between deploys) is not an alert
            if not alive:
                emit("error", "web_down", detail="neither web colour answered /health")
            for color in alive:
                try:
                    m = get("http://%s:8000/metrics" % color)
                    deep = {k: m[k] for k in QUEUE_KEYS if m.get(k, 0) > DEPTH_LIMIT}
                    if deep:
                        emit("error", "queue_depth_high", color=color, queues=deep, limit=DEPTH_LIMIT)
                    if m.get("workers", 0) == 0:
                        emit("error", "no_workers_registered", color=color)
                    for key in COUNTERS:
                        value = m.get(key, 0)
                        if key in prev_counters and value > prev_counters[key]:
                            emit("warn", "reconcile_counter_rising", color=color, counter=key, delta=value - prev_counters[key])
                        prev_counters[key] = value
                    qh = get("http://%s:8000/health/queue" % color)
                    if qh.get("total_workers") and qh.get("busy_workers") == qh["total_workers"]:
                        saturation[color] = saturation.get(color, 0) + 1
                    else:
                        saturation[color] = 0
                    if saturation[color] >= SATURATION_POLLS:
                        emit("warn", "workers_saturated", color=color, busy=qh.get("busy_workers"),
                             total=qh.get("total_workers"), consecutive_polls=saturation[color])
                except Exception as exc:
                    emit("warn", "watcher_probe_failed", color=color, detail=repr(exc))
            time.sleep(POLL)

  # One-shot, observable maintenance workload. The deploy starts this only
  # after the new web color is active; DB eligibility is its resume checkpoint.
  oa-profile-backfill:
    logging: *default-logging
    profiles: ["maintenance"]
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    command:
      ["python", "-m", "scripts.backfill_oa_profiles", "--apply", "--limit", "0"]
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  # SPA served by the frontend nginx image; Caddy reverse-proxies to it.
  frontend:
    logging: *default-logging
    image: ghcr.io/4rankng/tinghire-fe:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    expose: ["80"]
    deploy:
      resources:
        limits:
          # nginx serving a static SPA: a few MB of heap plus buffers.
          memory: 64M
    healthcheck:
      # OPS-24: the edge was only ever probed at deploy time, so a frontend that
      # came up broken (or a bad nginx.conf in the pushed image) stayed invisible
      # until a human hit the site. wget is guaranteed here: the base is
      # nginx:alpine, whose busybox ships /usr/bin/wget (verified in the image).
      # try_files falls back to /index.html, so / is the SPA's real entrypoint.
      test: ["CMD-SHELL", "wget -q --spider -T 4 http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      # nginx binds :80 in well under a second; 5s only covers the image's own
      # start-up ordering (workers + config load) on a cold, loaded host.
      start_period: 5s
    restart: unless-stopped

  # DB UI — bound to loopback only. Reach via `make adminer` SSH tunnel.
  adminer:
    logging: *default-logging
    image: adminer:4@sha256:c1c24d89d06fcb8fc0fb5a049240dc292ff4a121ae05d7e74d64b58c421d2921
    depends_on: [postgres]
    ports: ["127.0.0.1:8081:8080"]
    deploy:
      resources:
        limits:
          # Single PHP process serving an on-demand DB UI.
          memory: 128M
    restart: unless-stopped

  caddy:
    logging: *default-logging
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    depends_on:
      # Caddy proxies the ACTIVE web-<color> (tracked in /opt/vfic/ACTIVE_COLOR,
      # rendered into ./Caddyfile by flip_caddy.sh). It must NOT depend on a fixed
      # color: the inactive one is stopped between deploys, and gating on it would
      # block startup. The active color auto-starts on reboot (unless-stopped); the
      # brief cold-boot 502 window is unchanged from the single-web era.
      frontend: { condition: service_started }
    ports: ["80:80", "443:443"]
    healthcheck:
      # OPS-24: the edge had no in-stack probe either, so a Caddy that failed to
      # load the rendered Caddyfile kept reporting "up" to compose while 502ing
      # every request. Probe the rendered listener and accept 200 OR 308: with
      # auto-TLS the site only answers :80 with a permanent redirect to :443
      # (verified against caddy:2 — `curl -w %{http_code}` returns 308), and that
      # redirect IS the proof the listener and the site block loaded. Deliberately
      # NOT busybox `wget --spider`: it follows the 308 out to the public host, so
      # the probe would leave the container and depend on public DNS/egress.
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1/); [ \"$$code\" = 200 ] || [ \"$$code\" = 308 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      # ACME issuance for the apex cert can take several seconds on first boot;
      # a probe firing before :443 serves would flap the edge to unhealthy.
      start_period: 30s
    deploy:
      resources:
        limits:
          # Caddy's own docs put idle usage at a few tens of MB; it must stay
          # small so the edge never competes with the data plane for RAM.
          memory: 64M
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vfic_caddy_data:/data
      - vfic_caddy_config:/config
    restart: unless-stopped

volumes:
  vfic_pgdata:
  vfic_redisdata:
  vfic_caddy_data:
  vfic_caddy_config:
  vfic_kb_uploads:
