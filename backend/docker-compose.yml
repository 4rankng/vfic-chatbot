# VFIC production stack — image-based. Shipped to /opt/vfic on the droplet.
# Images: ghcr.io/4rankng/tinghire-be (web + workers + scheduler),
#         ghcr.io/4rankng/tinghire-fe (nginx static). Caddy = edge (auto-TLS).
# All app config comes from .env (compose auto-loads /opt/vfic/.env).
#
# Host (OPS-09, measured 2026-09-24): DigitalOcean droplet, 1 vCPU / 2 GB RAM
# (1967 MB usable) + 4 GB swap, 48 GB disk. These deploy-time figures are the
# authoritative ones; any doc claiming "4 GB" is stale. Memory limits are sized
# from measured resident usage — see the sum documented in
# docs/deployment-guide.md §1.
#
# App images are `${IMAGE_TAG:?…}`: a required variable, so no compose command
# can silently resolve `:latest` (OPS-10). Base images are digest-pinned for the
# same reason; .github/workflows/pin-refresh.yml opens a PR when a digest moves.

# --- Log rotation (OPS-04) ---------------------------------------------------
# Structured JSON logs to stdout are the only observability path by design, so
# every container must be bounded: the default json-file driver grows without
# limit and, when the volume fills, Postgres cannot write WAL and the whole stack
# goes down. One anchor, attached to every service — 10 MB × 3 files = a 30 MB
# ceiling per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Digest-pinned (OPS-10): the tag stays for readability, the digest is what
    # resolves, so an unattended pull cannot change the runtime under a frozen
    # application version.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    command: ["postgres", "-c", "max_connections=150"]
    # Docker's 64 MB /dev/shm default makes parallel sorts/hash joins fail with
    # "could not resize shared memory segment" — reachable at max_connections=150.
    shm_size: 256mb
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 448M  # measured 181 MB resident; shared_buffers alone is 128 MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vfic}
    volumes: [vfic_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    logging: *default-logging
    deploy:
      resources:
        limits:
          # --maxmemory 256mb bounds the dataset; the extra headroom covers the
          # AOF rewrite fork's copy-on-write pages (measured 6 MB resident).
          memory: 320M
    # volatile-lru: only TTL'd keys (embedding/RAG caches) are evictable. The
    # LLM semaphore token lists and cachever:* counters carry no TTL, so memory
    # pressure can never evict them and suppress every turn or resurrect stale
    # cache generations.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [vfic_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Blue/green web tier (zero-downtime deploy) -----------------------------
  # Two identical web replicas. Only the ACTIVE color (tracked in
  # /opt/vfic/ACTIVE_COLOR) receives traffic via the Caddyfile, which
  # reverse-proxies the active ``web-<color>:8000`` upstream. bg_deploy.sh brings
  # up the inactive color at the new IMAGE_TAG, runs scripts/smoke_turn.py
  # against it, then flip_caddy.sh renders + reloads Caddy onto it (graceful,
  # <1s, no dropped connections) and stops the old color. ``restart: unless-
  # stopped`` auto-restarts the active color on host reboot; the inactive color
  # is left ``stop``ped (not removed) so ``make rollback`` can revive it instantly.
  web-blue:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:?IMAGE_TAG is required — the deploy passes the git sha}
    env_file: .env
    environment:
      # DB connection budget (see config.py): the steady state is ONE active web
      # colour + 3 chatbot + persistence/ingest/followup/maintenance workers = 8
      # DB-touching processes, i.e. 12 + 6×6 = 48 of the max_connections=150
      # ceiling. A cutover briefly adds the second colour's 12 (60 worst case).
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 384M  # measured 118 MB resident (single uvicorn worker)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    expose: ["8000"]
    healthcheck:
      # uvicorn serves /health on :8000. Python is guaranteed in the image (no curl dep).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
      # 30s absorbs the cold-boot fork window so compose's own probe does not
      # start firing before the single uvicorn worker has bound :8000.
      start_period: 30s
    restart: unless-stopped

  web-green:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    expose: ["8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # RQ worker: interactive/recovery turns only. It stays isolated from
  # post-send enrichment so a slow persistence job cannot delay a webhook.
  worker-chatbot:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      # Workers run one job at a time (SimpleWorker) — 4+2 is ample and keeps
      # the deployment-wide worst case well under max_connections=150.
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.run_worker", "webhook_high", "recovery"]
    stop_grace_period: 180s  # let rq finish the ≤60s turn on SIGTERM before SIGKILL
    deploy:
      replicas: 3  # RQ consumes webhook_high first and recovery second, so a
                   # recovered-turn backlog can never delay a live candidate turn.
                   # 3 replicas raise cross-conversation throughput (per-chat locks
                   # serialize same-chat turns); the 2026-09-22 recovery storm of
                   # 62 turns held candidates for 30–115s on 2.
      resources:
        limits:
          # 3 instances × measured RSS ~130M ≈ 390M on the 2GB droplet. 512M cap
          # per container lets Docker OOM-kill a runaway worker without taking
          # the host down; host headroom verified at deploy time.
          memory: 512M
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: best-effort lead/memory enrichment after a reply is sent.
  # It deliberately does not warm the chatbot graph or consume webhook_high.
  worker-persistence:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.run_worker", "persistence_low"]
    stop_grace_period: 180s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: knowledge ingest / reindex / bus rebuild (slow, Drive-bound).
  worker-ingest:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    command: ["rq", "worker", "ingest", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # rq-scheduler: hourly Drive reconcile, 5-min outbound retry, 30-min proactive follow-up tick.
  scheduler:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    command: ["rqscheduler", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: proactive follow-up nudges (dedicated queue, isolated from reactive path).
  # Single replica — proactive volume is low (~5 candidates/tick, 30-min interval).
  # The reconcile sweep and outbound-dispatch ticks moved to worker-maintenance
  # so a backlog-driven reconcile cannot head-of-line-block the nudges.
  worker-followup:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["rq", "worker", "followup", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: reconcile sweep + outbound dispatch ticks (maintenance queue,
  # split from followup). Single replica — the reconcile tick holds a Redis
  # non-reentrancy lock (reconcile_tick_lock, 300s), so overlapping schedules
  # skip; one worker keeps the two 60s ticks from competing with nudges.
  worker-maintenance:
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      DB_POOL_SIZE: "4"
      DB_MAX_OVERFLOW: "2"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["rq", "worker", "maintenance", "--url", "${REDIS_URL}"]
    stop_grace_period: 180s  # let a mid-sweep reconcile finish on SIGTERM
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # One-shot, observable maintenance workload. The deploy starts this only
  # after the new web color is active; DB eligibility is its resume checkpoint.
  oa-profile-backfill:
    profiles: ["maintenance"]
    image: ghcr.io/4rankng/tinghire-be:${IMAGE_TAG:-latest}
    env_file: .env
    command:
      ["python", "-m", "scripts.backfill_oa_profiles", "--apply", "--limit", "0"]
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  # SPA served by the frontend nginx image; Caddy reverse-proxies to it.
  frontend:
    image: ghcr.io/4rankng/tinghire-fe:${IMAGE_TAG:-latest}
    expose: ["80"]
    restart: unless-stopped

  # DB UI — bound to loopback only. Reach via `make adminer` SSH tunnel.
  adminer:
    image: adminer:4
    depends_on: [postgres]
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      # Caddy proxies the ACTIVE web-<color> (tracked in /opt/vfic/ACTIVE_COLOR,
      # rendered into ./Caddyfile by flip_caddy.sh). It must NOT depend on a fixed
      # color: the inactive one is stopped between deploys, and gating on it would
      # block startup. The active color auto-starts on reboot (unless-stopped); the
      # brief cold-boot 502 window is unchanged from the single-web era.
      frontend: { condition: service_started }
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vfic_caddy_data:/data
      - vfic_caddy_config:/config
    restart: unless-stopped

volumes:
  vfic_pgdata:
  vfic_redisdata:
  vfic_caddy_data:
  vfic_caddy_config:
  vfic_kb_uploads:
