# VFIC production stack — image-based. Shipped to /opt/vfic on the droplet.
# Images: franknguyenvd/vfic-backend (web + workers + scheduler),
#         franknguyenvd/vfic-frontend (nginx static). Caddy = edge (auto-TLS).
# All app config comes from .env (compose auto-loads /opt/vfic/.env).
services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=150"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vfic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vfic}
    volumes: [vfic_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [vfic_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    image: franknguyenvd/vfic-backend:latest
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    expose: ["8000"]
    healthcheck:
      # uvicorn serves /health on :8000. Python is guaranteed in the image (no curl dep).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # RQ worker: interactive/recovery turns + lead/memory persistence.
  worker-chatbot:
    image: franknguyenvd/vfic-backend:latest
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "app.workers.run_worker", "webhook_high", "persistence_low"]
    stop_grace_period: 180s  # let rq finish the ≤60s turn on SIGTERM before SIGKILL
    deploy:
      replicas: 1
      resources:
        limits:
          # TODO: measure real RSS under load (expect ~100-150M per worker).
          # 512M leaves room for the two web workers on a 4GB droplet.
          memory: 512M
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: knowledge ingest / reindex / bus rebuild (slow, Drive-bound).
  worker-ingest:
    image: franknguyenvd/vfic-backend:latest
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: [vfic_kb_uploads:/data/kb_uploads]
    command: ["rq", "worker", "ingest", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # rq-scheduler: hourly Drive reconcile, 5-min outbound retry, 30-min proactive follow-up tick.
  scheduler:
    image: franknguyenvd/vfic-backend:latest
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
    command: ["rqscheduler", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # RQ worker: proactive follow-up nudges (dedicated queue, isolated from reactive path).
  # Single replica — proactive volume is low (~5 candidates/tick, 30-min interval).
  worker-followup:
    image: franknguyenvd/vfic-backend:latest
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["rq", "worker", "followup", "--url", "${REDIS_URL}"]
    healthcheck:
      # Lightweight Redis ping (no full rq/app import, no broker URL in argv).
      # redis-py is present transitively via rq; python is on PATH in the image.
      test: ["CMD-SHELL", "python -c \"import os,redis; redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=3, socket_timeout=3).ping()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # SPA served by the frontend nginx image; Caddy reverse-proxies to it.
  frontend:
    image: franknguyenvd/vfic-frontend:latest
    expose: ["80"]
    restart: unless-stopped

  # DB UI — bound to loopback only. Reach via `make adminer` SSH tunnel.
  adminer:
    image: adminer:4
    depends_on: [postgres]
    ports: ["127.0.0.1:8081:8080"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      # service_started (not service_healthy): a full-stack recreate boots web + 6 workers
      # at once, and the transient CPU spike can blip web's healthcheck. Gating Caddy on
      # service_healthy made `make deploy` abort with "web is unhealthy" even though web
      # recovers seconds later. Caddy is a reverse proxy — it tolerates the brief gap.
      web: { condition: service_started }
      frontend: { condition: service_started }
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - vfic_caddy_data:/data
      - vfic_caddy_config:/config
    restart: unless-stopped

volumes:
  vfic_pgdata:
  vfic_redisdata:
  vfic_caddy_data:
  vfic_caddy_config:
  vfic_kb_uploads:
